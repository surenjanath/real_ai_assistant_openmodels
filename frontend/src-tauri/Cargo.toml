[package]
name = "jarvis-interface"
version = "1.0.0"
description = "J.A.R.V.I.S. desktop wrapper (macOS) - shells the Next.js holographic interface"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
